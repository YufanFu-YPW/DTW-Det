task: detection

evaluator:
  type: VisdroneCocoEvaluator
  iou_types: ['bbox', ]

num_classes: 10
remap_mscoco_category: True

# num_classes: 12
# remap_mscoco_category: False

eval_spatial_size: [800, 800] # h w

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /hy-tmp/Datasets/VisDrone2019/VisDrone2019-DET-train/images
    ann_file: /hy-tmp/Datasets/VisDrone2019/Anno/VisDrone2019-DET_train_coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  batch_size: 8
  num_workers: 4
  drop_last: True


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /hy-tmp/Datasets/VisDrone2019/VisDrone2019-DET-val/images
    ann_file: /hy-tmp/Datasets/VisDrone2019/Anno/VisDrone2019-DET_val_coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~

  shuffle: False
  batch_size: 8
  num_workers: 4
  drop_last: False